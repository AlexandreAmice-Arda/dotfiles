# Tiling vocabulary shared with Sway and VS Code.
#
#   Ctrl + direction             focus a pane
#   Ctrl + Alt + direction       move a pane
#   Ctrl + Alt + Shift + arrows  resize a pane
#   Ctrl + Alt + b/v             split side-by-side / top-bottom
#   Ctrl + Alt + f/q             zoom / close

set -g mouse on
set -g history-limit 50000

# Match Herdr's one-based tab numbers and keep the list compact after a window
# closes. A running session may retain old indexes until those windows close.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Forward terminal focus changes to applications and avoid the default 500 ms
# delay before a standalone Escape is recognized on a local terminal.
set -s focus-events on
set -s escape-time 10

# Foot supports true color and OSC 8 hyperlinks, but its terminfo entry does
# not advertise RGB to tmux 3.4. Declare both features explicitly.
set -as terminal-features ',foot*:RGB:hyperlinks'

# Focus panes directly, without the tmux prefix. Ctrl-H is deliberately left
# to the terminal: many terminals encode Ctrl-Backspace as Ctrl-H.
unbind-key -n C-Left
unbind-key -n C-Down
unbind-key -n C-Up
unbind-key -n C-Right
unbind-key -n C-h
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

# Move the focused pane into the neighboring pane's position. At the outer
# edge, leave the layout unchanged instead of displaying a target error.
bind-key -n C-M-h if-shell -F '#{pane_at_left}' '' 'swap-pane -d -t "{left-of}"'
bind-key -n C-M-j if-shell -F '#{pane_at_bottom}' '' 'swap-pane -d -t "{down-of}"'
bind-key -n C-M-k if-shell -F '#{pane_at_top}' '' 'swap-pane -d -t "{up-of}"'
bind-key -n C-M-l if-shell -F '#{pane_at_right}' '' 'swap-pane -d -t "{right-of}"'
bind-key -n C-M-Left if-shell -F '#{pane_at_left}' '' 'swap-pane -d -t "{left-of}"'
bind-key -n C-M-Down if-shell -F '#{pane_at_bottom}' '' 'swap-pane -d -t "{down-of}"'
bind-key -n C-M-Up if-shell -F '#{pane_at_top}' '' 'swap-pane -d -t "{up-of}"'
bind-key -n C-M-Right if-shell -F '#{pane_at_right}' '' 'swap-pane -d -t "{right-of}"'

# Match Sway's split vocabulary and retain the focused pane's directory.
bind-key -n C-M-b split-window -h -c '#{pane_current_path}'
bind-key -n C-M-v split-window -v -c '#{pane_current_path}'

# Match the Sway resize mode: left/up shrink, right/down grow. Bindings repeat
# while held and change the pane by two cells per key event.
bind-key -r -n C-M-S-Left resize-pane -x '#{e|-:#{pane_width},2}'
bind-key -r -n C-M-S-Up resize-pane -y '#{e|-:#{pane_height},2}'
bind-key -r -n C-M-S-Right resize-pane -x '#{e|+:#{pane_width},2}'
bind-key -r -n C-M-S-Down resize-pane -y '#{e|+:#{pane_height},2}'

bind-key -n C-M-f resize-pane -Z
bind-key -n C-M-q confirm-before -p 'Kill pane #P? (y/n)' kill-pane

# Tokyo Night status line; keybindings and pane behavior above remain unchanged.
set -g status-position bottom
set -g status-style 'bg=#1a1b26,fg=#a9b1d6'
set -g status-left-length 30
set -g status-right-length 80
set -g status-left '#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26] '
set -g status-right '#[fg=#565f89]#(whoami)@#H  #[fg=#7dcfff]%H:%M #[fg=#bb9af7]%d-%b-%y '
set -g window-status-format '#[fg=#565f89] #I:#W '
set -g window-status-current-format '#[fg=#1a1b26,bg=#bb9af7,bold] #I:#W '
set -g pane-border-style 'fg=#414868'
set -g pane-active-border-style 'fg=#7aa2f7'
set -g message-style 'bg=#24283b,fg=#7dcfff'
set -g mode-style 'bg=#7aa2f7,fg=#1a1b26'

# Rebuild terminal structure after a reboot. Continuum snapshots every five
# minutes; resurrect restores sessions, windows, panes, layouts, and working
# directories when the next terminal starts a fresh tmux server.
#
# Deliberately do not replay processes or save pane text: stale commands can be
# unsafe, and scrollback may contain secrets. Resume stateful tools themselves
# after restore (for example, `codex resume`). Prefix + Ctrl-s forces a save;
# Prefix + Ctrl-r performs a manual restore.
set -g @resurrect-processes 'false'
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Chezmoi installs these pinned plugins on Ubuntu and macOS. The guards keep
# tmux usable if a first install is temporarily offline.
if-shell '[ -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux ]' \
    'run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
if-shell '[ -f ~/.tmux/plugins/tmux-continuum/continuum.tmux ]' \
    'run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux'
