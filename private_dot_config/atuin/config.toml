# Portable behavior only. Authentication, encryption keys, and databases stay
# machine-local under ~/.local/share/atuin and are never managed by chezmoi.
auto_sync = true
sync_address = "https://api.atuin.sh"
sync_frequency = "5m"
update_check = false

search_mode = "fuzzy"
filter_mode = "global"
style = "compact"
enter_accept = false
secrets_filter = true

# Keep obvious credentials out of history in addition to Atuin's built-in
# secret detection. A leading space is the deliberate one-command escape hatch.
history_filter = [
  "^\\s",
  "(?i)(^|[[:space:]])atuin[[:space:]]+(register|login)([[:space:]]|$)",
  "(?i)(^|[[:space:]])--?(password|passwd|token|secret|api[_-]?key|access[_-]?key)(=|[[:space:]])",
  "(?i)(^|[[:space:]])(password|passwd|token|secret|api[_-]?key|access[_-]?key)=[^[:space:]]+",
]

[tmux]
enabled = true
width = "80%"
height = "60%"
