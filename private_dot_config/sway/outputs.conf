# Portable hosts use Sway's automatic output placement. The personal
# workstation's named dock layouts are managed by Kanshi.
# Keeping it in a script permits a clean laptop-only fallback while preserving
# the saved four-monitor arrangement when all three known displays reconnect.

# Work around repeated atomic page-flip EBUSY failures on the Intel
# four-display setup by giving each output a small render deadline.
output * max_render_time 2
