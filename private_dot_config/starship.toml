"$schema" = "https://starship.rs/config-schema.json"
add_newline = false

# Untruncated directory, command context, and a clean input glyph each get a line.
format = """
${custom.remote}\
$directory\
$line_break\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

[custom.remote]
when = 'test -n "${SSH_CONNECTION:-}${SSH_CLIENT:-}"'
command = 'printf "%s@%s" "$USER" "$(hostname -s)"'
style = "bold #7dcfff"
format = "[$output]($style)\n"
shell = ["sh"]

[directory]
style = "bold #7aa2f7"
format = "[$path]($style)"
truncation_length = 0
truncate_to_repo = false

[git_branch]
symbol = ""
style = "#bb9af7"
format = "[  $symbol $branch]($style)"

[git_status]
style = "#f7768e"
format = "[($all_status$ahead_behind)]($style)"

[cmd_duration]
min_time = 2000
style = "#737aa2"
format = "[  $duration]($style)"

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"
