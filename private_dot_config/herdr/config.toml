# Herdr is the agent-aware terminal workspace. General persistent shells stay
# in tmux; session data, logs, sockets, and pane contents remain machine-local.
onboarding = false

[theme]
name = "tokyo-night"

[keys]
prefix = "ctrl+b"

# Keep Herdr's prefix bindings while adding the direct pane vocabulary used by
# tmux. Foot and Ghostty map Ctrl-Backspace separately, so H/J/K/L are all
# available for direct pane focus.
focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]
split_vertical = ["prefix+v", "ctrl+alt+b"]
split_horizontal = ["prefix+minus", "ctrl+alt+v"]
zoom = ["prefix+z", "ctrl+alt+f"]
close_pane = ["prefix+x", "ctrl+alt+q"]
resize_pane_left = "ctrl+shift+alt+left"
resize_pane_down = "ctrl+shift+alt+down"
resize_pane_up = "ctrl+shift+alt+up"
resize_pane_right = "ctrl+shift+alt+right"

# Herdr 0.9.1 exposes pane swaps through its CLI but not as native key fields.
# These direct commands provide the same H/J/K/L and arrow bindings as tmux.
[[keys.command]]
key = ["ctrl+alt+h", "ctrl+alt+left"]
type = "shell"
command = "herdr pane swap --direction left --current"
description = "swap pane left"

[[keys.command]]
key = ["ctrl+alt+j", "ctrl+alt+down"]
type = "shell"
command = "herdr pane swap --direction down --current"
description = "swap pane down"

[[keys.command]]
key = ["ctrl+alt+k", "ctrl+alt+up"]
type = "shell"
command = "herdr pane swap --direction up --current"
description = "swap pane up"

[[keys.command]]
key = ["ctrl+alt+l", "ctrl+alt+right"]
type = "shell"
command = "herdr pane swap --direction right --current"
description = "swap pane right"

[session]
resume_agents_on_restore = true

[ui]
agent_panel_sort = "spaces"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "system"
delay_seconds = 2

[ui.sound]
enabled = false

[experimental]
# Pane output can contain prompts, tokens, and command output. Agent session
# identity is enough for native Codex restore, so do not persist screen text.
pane_history = false
