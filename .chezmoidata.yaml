desktop:
  support:
    ubuntu_minimum: "24.04"
    macos_minimum_major: 13
    qualified_ubuntu:
      - "24.04"
    qualified_macos: []
  power:
    lock_seconds: 600
    display_off_seconds: 900
    battery_suspend_seconds: 1800
  fonts:
    interface: "JetBrains Mono"
    terminal: "JetBrainsMono Nerd Font"
    icons: "FontAwesome"
  layout:
    gaps_inner: 6
    gaps_outer: 3
    terminal_font_size: 11
    terminal_padding_x: 12
    terminal_padding_y: 10
  theme:
    background: "1a1b26"
    background_deep: "10111a"
    surface: "24283b"
    surface_alt: "414868"
    surface_hover: "292e45"
    foreground: "c0caf5"
    foreground_alt: "a9b1d6"
    muted: "737aa2"
    subtle: "565f89"
    bright:
      pink: "ff9eae"
      green: "b9f27c"
      yellow: "ffcf72"
      blue: "9abdf5"
      purple: "c7a9ff"
      cyan: "a4daff"
    blue: "7aa2f7"
    cyan: "7dcfff"
    purple: "bb9af7"
    pink: "f7768e"
    green: "9ece6a"
    yellow: "e0af68"
  directions:
    - name: left
      label: Left
      key: h
    - name: down
      label: Down
      key: j
    - name: up
      label: Up
      key: k
    - name: right
      label: Right
      key: l
  workspaces:
    - name: "1"
      key: "1"
    - name: "2"
      key: "2"
    - name: "3"
      key: "3"
    - name: "4"
      key: "4"
    - name: "5"
      key: "5"
    - name: "6"
      key: "6"
    - name: "7"
      key: "7"
    - name: "8"
      key: "8"
    - name: "9"
      key: "9"
    - name: "10"
      key: "0"
  profiles:
    amice_workstation:
      primary_output_serials:
        - "PH5NY1BH326L"
        - "6N45XC3"
